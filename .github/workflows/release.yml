name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.4.1. Defaults to v<manifest version>.'
        required: false
        type: string
      prerelease:
        description: 'Mark this release as a pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out extension
        uses: actions/checkout@v4

      - name: Resolve version and tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          version="$(jq -r '.version // empty' manifest.json)"
          if [ -z "$version" ]; then
            echo "::error file=manifest.json::manifest.json has no version field"
            exit 1
          fi

          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="v${version}"
          fi

          if [ "$tag" != "v${version}" ]; then
            echo "::error file=manifest.json::Tag '${tag}' does not match manifest version '${version}' (expected 'v${version}'). Bump manifest.json or retag."
            exit 1
          fi

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "zip=leetbook-${tag}.zip"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing ${tag} (manifest version ${version})"

      - name: Verify extension payload
        shell: bash
        run: |
          set -euo pipefail

          jq empty manifest.json

          for path in manifest.json service-worker-loader.js assets icons src .vite; do
            if [ ! -e "$path" ]; then
              echo "::error::Required path '${path}' is missing from the repository"
              exit 1
            fi
          done

          manifest_version="$(jq -r '.manifest_version' manifest.json)"
          if [ "$manifest_version" != "3" ]; then
            echo "::error file=manifest.json::Expected manifest_version 3, found '${manifest_version}'"
            exit 1
          fi

      - name: Package extension
        shell: bash
        run: |
          set -euo pipefail

          git archive --format=zip --prefix=leetbook/ -o "${{ steps.meta.outputs.zip }}" HEAD

          {
            echo "### Package contents"
            echo '```'
            unzip -l "${{ steps.meta.outputs.zip }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          cat > RELEASE_NOTES.md <<EOF
          ## Install

          1. Download **\`${{ steps.meta.outputs.zip }}\`** from the assets below.
          2. Unzip it - you'll get a \`leetbook\` folder.
          3. Open \`chrome://extensions/\` in Chrome or Edge.
          4. Turn on **Developer mode**.
          5. Click **Load unpacked** and select the unzipped \`leetbook\` folder.

          **Version:** \`${{ steps.meta.outputs.version }}\`
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.meta.outputs.tag }}"
          zip="${{ steps.meta.outputs.zip }}"

          prerelease_flag=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            prerelease_flag="--prerelease"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip" --clobber
            gh release edit "$tag" --notes-file RELEASE_NOTES.md $prerelease_flag
          else
            gh release create "$tag" "$zip" \
              --title "LeetBook $tag" \
              --notes-file RELEASE_NOTES.md \
              --generate-notes \
              $prerelease_flag
          fi

          echo "Published: $(gh release view "$tag" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
